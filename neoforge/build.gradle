plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

    maven {
        name = "OctoStudios"
        url = uri("https://maven.octo-studios.com/releases")
    }

    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:${architectury_api_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // EMI
    modCompileOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api"
    modLocalRuntime "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"

    // Curios
    // runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    //implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Moving over to Accessories - recommended to utilise the Curios Compatibility Layer
    compileOnly "io.wispforest:accessories-neoforge:${accessories_version}+${minecraft_version}"
    runtimeOnly "io.wispforest:accessories-neoforge:${accessories_version}+${minecraft_version}"

    // Patchouli
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}-NEOFORGE:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}-NEOFORGE"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
